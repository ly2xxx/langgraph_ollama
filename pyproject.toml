[project]
name = "langgraph-ollama"
version = "0.1.0"
description = "LangGraph + Ollama multi-agent / RAG experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangChain 0.3.x stack
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-community>=0.3,<0.4",
    "langchain-text-splitters>=0.3,<0.4",
    "langchain-ollama>=0.2",
    # LangGraph stack + sqlite checkpointer + CLI
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2",
    "langgraph-cli[inmem]",
    # App / UI
    "streamlit",
    "pillow",
    "graphviz",
    # Data / documents
    "pandas",
    "openpyxl",
    "python-docx",
    "pymupdf",
    "beautifulsoup4",
    "faiss-cpu",
    # Web / scraping
    "selenium",
    "webdriver-manager",
    # Misc
    "python-dotenv",
    "pydantic>=2",
    "pypdf>=6.14.0",
    "tavily-python>=0.7.26",
    "langchain-mcp-adapters>=0.1.9,<0.2",
    # Coding Engineer agent (coding_agent/) — self_check/bdd_gate run these
    # against the target worktree, so they're runtime deps, not dev-only.
    "pytest>=8",
    "pytest-bdd>=7",
    "pytest-json-report>=1.5",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# EXE002 (executable bit set but no shebang) fires on every file on some
# mounted/network filesystems that always report the executable bit,
# regardless of actual content -- not a meaningful signal for this project
# (no shell-invoked scripts), and specifically noisy for the Coding Engineer
# agent's self_check/bdd_gate gates (coding_agent/CODING_ENGINEER.md §4),
# which run `ruff check .` against arbitrary target worktrees.
# UP017 (prefer the `datetime.UTC` alias over `timezone.utc`) -- both are
# correct on this project's Python >=3.12 floor; `timezone.utc` is kept
# because it's also what a dev/CI environment pinned to an older
# interpreter can run, and there's no functional difference.
ignore = ["EXE002", "UP017"]

[project.optional-dependencies]
# Observability stack — install with: uv sync --extra observability
# Kept optional so the core app has no hard dependency on OpenTelemetry.
observability = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25",
    "openinference-instrumentation-langchain>=0.1.29",
    # Injects W3C traceparent into outbound httpx calls (MCP tool requests),
    # linking agent traces with md-mcp server traces.
    "opentelemetry-instrumentation-httpx>=0.46b0",
]
