apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-data-tier
  namespace: ai-platform
  labels:
    app.kubernetes.io/part-of: besa-ai-platform
    tier: security-policy
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    # Only allow connections to Postgres port 5432 from Langfuse Web and LiteLLM within ai-platform
    - from:
        - podSelector:
            matchLabels:
              app: langfuse-web
        - podSelector:
            matchLabels:
              app: litellm
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-agents-to-platform
  namespace: agent-apps
  labels:
    app.kubernetes.io/part-of: besa-agent-platform
    tier: security-policy
spec:
  podSelector:
    matchLabels:
      tier: agent-runtime
  policyTypes:
    - Egress
  egress:
    # 1. Allow intra-namespace traffic (Agents, Gateway, MCP, Sandbox, WebUI)
    - to:
        - podSelector: {}
    # 2. Allow DNS resolution to kube-system CoreDNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 3. Allow authorized egress to ai-platform ports (LiteLLM: 4000, Milvus: 19530, Langfuse: 3000)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-platform
      ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 19530
        - protocol: TCP
          port: 3000
