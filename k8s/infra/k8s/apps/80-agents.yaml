    if __name__ == '__main__':
        server = HTTPServer(('0.0.0.0', 8080), Agent2Handler)
        print("Specialist Agent (agent-2) listening on port 8080...")
        server.serve_forever()


  wait_for_platform.py: |
    import sys, time, urllib.request, socket

    litellm_url = "http://litellm.ai-platform.svc.cluster.local:4000/health/liveliness"
    milvus_host = "milvus.ai-platform.svc.cluster.local"
    milvus_port = 19530

    print("Waiting for LiteLLM Gateway...")
    while True:
        try:
            req = urllib.request.Request(litellm_url)
            with urllib.request.urlopen(req, timeout=3) as resp:
                if resp.status == 200:
                    print("LiteLLM is Ready.")
                    break
        except Exception as e:
            print(f"LiteLLM not ready yet ({e}), waiting 2s...")
            time.sleep(2)

    print("Waiting for Milvus Standalone...")
    while True:
        try:
            with socket.create_connection((milvus_host, milvus_port), timeout=3):
                print("Milvus is Ready.")
                break
        except Exception as e:
            print(f"Milvus not ready yet ({e}), waiting 2s...")
            time.sleep(2)

    print("All platform dependencies ready!")

  curl: |
    #!/usr/bin/env python3
    import sys, urllib.request
    args = sys.argv[1:]
    url = None
    method = 'GET'
    data = None
    headers = {'User-Agent': 'curl-shim/1.0'}
    i = 0
    while i < len(args):
        arg = args[i]
        if arg in ('-X', '--request') and i + 1 < len(args):
            method = args[i + 1].upper()
            i += 2
        elif arg in ('-d', '--data', '--data-raw'):
            d_tokens = []
            i += 1
            while i < len(args) and not args[i].startswith('-') and not (args[i].startswith('http://') or args[i].startswith('https://')):
                d_tokens.append(args[i])
                i += 1
            data = ' '.join(d_tokens).encode('utf-8')
            if method == 'GET':
                method = 'POST'
        elif arg in ('-H', '--header') and i + 1 < len(args):
            h = args[i + 1]
            if ':' in h:
                k, v = h.split(':', 1)
                headers[k.strip()] = v.strip()
            i += 2
        elif arg.startswith('http://') or arg.startswith('https://'):
            url = arg
            i += 1
        else:
            i += 1
    if not url:
        for arg in args:
            if '://' in arg or arg.startswith('localhost'):
                url = arg if '://' in arg else 'http://' + arg
                break
    if not url:
        sys.exit(1)
    try:
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, timeout=10) as resp:
            data_out = resp.read().decode('utf-8')
            print(data_out, end='')
            sys.exit(0 if resp.status < 400 else 1)
    except Exception as e:
        sys.exit(1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-1
  namespace: agent-apps
  labels:
    app: agent-1
    role: agent
    app.kubernetes.io/part-of: besa-agent-platform
    tier: agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-1
  template:
    metadata:
      labels:
        app: agent-1
        role: agent
        app.kubernetes.io/part-of: besa-agent-platform
        tier: agent-runtime
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      initContainers:
        - name: wait-for-platform
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - python
            - /etc/agent/wait_for_platform.py
          volumeMounts:
            - name: agent-config-volume
              mountPath: /etc/agent
      containers:
        - name: customer-agent
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              cp /etc/agent/curl /usr/local/bin/curl && chmod +x /usr/local/bin/curl
              python /etc/agent/agent1_server.py
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: agent-config
          volumeMounts:
            - name: agent-config-volume
              mountPath: /etc/agent
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: agent-config-volume
          configMap:
            name: agent-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: agent-1
  namespace: agent-apps
  labels:
    app: agent-1
    app.kubernetes.io/part-of: besa-agent-platform
    tier: agent-runtime
spec:
  type: ClusterIP
  selector:
    app: agent-1
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
