            if order_match:
                try:
                    mcp_req = urllib.request.Request(
                        f"{MCP_URL}/tools/lookup_order",
                        data=json.dumps({"order_id": order_match.group(0)}).encode('utf-8'),
                        headers={'Content-Type': 'application/json'},
