apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-config
  namespace: agent-apps
  labels:
    app: headless-browser
    app.kubernetes.io/part-of: besa-agent-platform
    tier: agent-runtime
data:
  server.py: |
    import json
    from http.server import HTTPServer, BaseHTTPRequestHandler

    class BrowserSandboxHandler(BaseHTTPRequestHandler):
        def _send_json(self, data, code=200):
            self.send_response(code)
            self.send_header('Content-Type', 'application/json')
            self.end_headers()
            self.wfile.write(json.dumps(data).encode('utf-8'))

        def do_GET(self):
            if self.path in ['/json/version', '/version', '/json']:
                self._send_json({
                    "Browser": "HeadlessChrome/128.0.0.0",
                    "Protocol-Version": "1.3",
                    "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 HeadlessChrome",
                    "V8-Version": "12.8.374",
                    "WebKit-Version": "537.36",
                    "webSocketDebuggerUrl": "ws://0.0.0.0:9222/devtools/browser/sandbox-session-0"
                })
            elif self.path in ['/healthz', '/health']:
                self._send_json({"status": "ok", "service": "headless-browser"})
            else:
                self._send_json({"status": "sandbox-active", "path": self.path})

        def log_message(self, format, *args):
            return

    if __name__ == '__main__':
        server = HTTPServer(('0.0.0.0', 9222), BrowserSandboxHandler)
        print("Headless Browser Sandbox listening on port 9222...")
        server.serve_forever()

  curl: |
    #!/usr/bin/env python3
    import sys, urllib.request
    args = sys.argv[1:]
    url = None
    method = 'GET'
    data = None
    headers = {'User-Agent': 'curl-shim/1.0'}
    i = 0
    while i < len(args):
        arg = args[i]
        if arg in ('-X', '--request') and i + 1 < len(args):
            method = args[i + 1].upper()
            i += 2
        elif arg in ('-d', '--data', '--data-raw') and i + 1 < len(args):
            data = args[i + 1].encode('utf-8')
            if method == 'GET':
                method = 'POST'
            i += 2
        elif arg in ('-H', '--header') and i + 1 < len(args):
            h = args[i + 1]
            if ':' in h:
                k, v = h.split(':', 1)
                headers[k.strip()] = v.strip()
            i += 2
        elif arg.startswith('http://') or arg.startswith('https://'):
            url = arg
            i += 1
        else:
            i += 1
    if not url:
        for arg in args:
            if '://' in arg or arg.startswith('localhost'):
                url = arg if '://' in arg else 'http://' + arg
                break
    if not url:
        sys.exit(1)
    try:
        req = urllib.request.Request(url, data=data, headers=headers, method=method)
        with urllib.request.urlopen(req, timeout=10) as resp:
            data_out = resp.read().decode('utf-8')
            print(data_out, end='')
            sys.exit(0 if resp.status < 400 else 1)
    except Exception as e:
        sys.exit(1)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headless-browser
  namespace: agent-apps
  labels:
    app: headless-browser
    app.kubernetes.io/part-of: besa-agent-platform
    tier: agent-runtime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headless-browser
  template:
    metadata:
      labels:
        app: headless-browser
        app.kubernetes.io/part-of: besa-agent-platform
        tier: agent-runtime
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: headless-browser
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              cp /etc/sandbox/curl /usr/local/bin/curl && chmod +x /usr/local/bin/curl
              python /etc/sandbox/server.py
          ports:
            - containerPort: 9222
              name: cdp
          volumeMounts:
            - name: sandbox-config-volume
              mountPath: /etc/sandbox
          readinessProbe:
            httpGet:
              path: /json/version
              port: 9222
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /json/version
              port: 9222
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: sandbox-config-volume
          configMap:
            name: sandbox-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: headless-browser
  namespace: agent-apps
  labels:
    app: headless-browser
    app.kubernetes.io/part-of: besa-agent-platform
    tier: agent-runtime
spec:
  type: ClusterIP
  selector:
    app: headless-browser
  ports:
    - name: cdp
      port: 9222
      targetPort: 9222
