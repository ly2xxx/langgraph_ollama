apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent-webui-ingress
  namespace: agent-apps
  labels:
    app: webui
    app.kubernetes.io/part-of: besa-agent-platform
    tier: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: agent.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webui
                port:
                  number: 8080
  tls:
    - hosts:
        - agent.localhost
