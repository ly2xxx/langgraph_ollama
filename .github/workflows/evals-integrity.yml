name: Eval Dataset Integrity

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    paths:
      - 'evals/**'
      - '.github/workflows/evals-integrity.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'evals/**'
      - '.github/workflows/evals-integrity.yml'
  workflow_dispatch:

jobs:
  check-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate dataset (Seeds must FAIL hidden tests)
        run: uv run python -m evals.runner --validate

      - name: Selftest dataset (Reference solutions must PASS hidden tests)
        run: uv run python -m evals.runner --selftest
